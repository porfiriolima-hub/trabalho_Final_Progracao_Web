<svg width="480" height="480" viewBox="0 0 480 480" fill="none" xmlns="http://www.w3.org/2000/svg">

  <!-- Fundo opcional (pode remover) -->
  <rect width="480" height="480" fill="#F2E9D8"/>

  <!-- Moldura preta com borda dourada -->
  <rect x="70" y="160" width="340" height="150" rx="20" fill="#111"/>
  <rect x="70" y="160" width="340" height="150" rx="20" stroke="#D4AF37" stroke-width="6"/>

  <!-- Texto BARBER -->
  <text x="240" y="225" font-family="Georgia, serif" font-size="58" fill="white" font-weight="700" text-anchor="middle">
    BARBER
  </text>

  <!-- Texto PRIME -->
  <text x="240" y="275" font-family="Georgia, serif" font-size="50" fill="white" font-weight="700" text-anchor="middle">
    PRIME
  </text>

  <!-- Texto inferior PREMIUM BARBERSHOP -->
  <text x="240" y="350" font-family="Arial, sans-serif" font-size="22" fill="#111" letter-spacing="3" text-anchor="middle">
    PREMIUM BARBERSHOP
  </text>

</svg>
